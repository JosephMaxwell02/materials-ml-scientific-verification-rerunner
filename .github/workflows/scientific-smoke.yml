name: Scientific mechanism smoke check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out canonical repository tree
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: environment/requirements.txt

      - name: Install declared environment and test harness
        run: |
          python -m pip install --upgrade pip
          python tools/install_reference_environment.py
          python -m pip install pytest==8.4.2

      - name: Verify Git-tree manifest
        run: python tools/verify_manifest.py

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run deterministic mechanism smoke check
        run: python run.py smoke
